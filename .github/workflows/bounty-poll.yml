name: Poll Payout Radar

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger polling endpoint
        env:
          POLL_URL: ${{ secrets.PAYOUT_RADAR_POLL_URL || vars.PAYOUT_RADAR_POLL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          : "${POLL_URL:?PAYOUT_RADAR_POLL_URL is not configured}"
          : "${CRON_SECRET:?CRON_SECRET is not configured}"
          echo "::add-mask::$POLL_URL"
          echo "::add-mask::$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --request GET "$POLL_URL" \
            --header "Authorization: Bearer $CRON_SECRET"
